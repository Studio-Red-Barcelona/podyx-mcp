version: 2
updates:
  - package-ecosystem: docker
    directory: /
    # Keep Node 24; major runtime upgrades require a deliberate maintainer PR.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [d3rky]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [d3rky]
    commit-message:
      prefix: chore
      include: scope
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [d3rky]
    commit-message:
      prefix: chore
      include: scope
