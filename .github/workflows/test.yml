name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/check-pr-title.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- docs/tools.md
      - run: npm test

  packages:
    name: Package smoke tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:plugins
      - run: npm run test:packages
      - run: npm pack --ignore-scripts --pack-destination dist
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release PR / GitHub Release
    needs: [test, packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skip a superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit has its own checks; leaving release work to that run."
          fi
      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.current.outputs.ready == 'true'
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Explicitly run checks on generated release PRs
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: node scripts/dispatch-release-checks.mjs
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.ready == 'true'
        with:
          name: release-assets-${{ github.sha }}
          path: dist
      - name: Attach verified archives (also repairs interrupted uploads)
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upload-release-assets.mjs

  open_setup_pr:
    name: Open maintainer setup PR
    needs: [test, packages]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/add-codeowners'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create bot-authored setup PR for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh pr view chore/add-codeowners --json url --jq .url; then
            gh pr create --base main --head chore/add-codeowners --title 'chore: add code ownership and repository guidance' --body-file .github/setup-pr.md
            gh pr edit chore/add-codeowners --add-reviewer d3rky
          fi
