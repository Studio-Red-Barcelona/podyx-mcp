name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/check-pr-title.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- docs/tools.md
      - run: npm test

  packages:
    name: Package smoke tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:plugins
      - run: npm run test:packages
      - run: npm pack --ignore-scripts --pack-destination dist
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release PR / GitHub Release
    needs: [test, packages, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      publish_image: ${{ steps.image_release.outputs.publish }}
      image_version: ${{ steps.image_release.outputs.version }}
      image_name: ${{ steps.image_release.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skip a superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit has its own checks; leaving release work to that run."
          fi
      - uses: googleapis/release-please-action@v5
        id: release
        if: steps.current.outputs.ready == 'true'
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Explicitly run checks on generated release PRs
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: node scripts/dispatch-release-checks.mjs
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.ready == 'true'
        with:
          name: release-assets-${{ github.sha }}
          path: dist
      - name: Attach verified archives (also repairs interrupted uploads)
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upload-release-assets.mjs
      - name: Identify a release at this checked commit
        id: image_release
        if: steps.current.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-image-info.mjs

  docker_lint:
    name: Docker lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Validate Compose configuration without studio secrets
        env:
          PODYX_ENV_FILE: /dev/null
        run: docker compose config --quiet

  docker_runtime:
    name: Docker runtime (${{ matrix.arch }})
    needs: docker_lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image for native architecture
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          tags: podyx-mcp:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - run: npm run test:docker
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: podyx-mcp:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  docker:
    name: Docker checks
    needs: [docker_lint, docker_runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and both architecture builds to pass
        env:
          LINT: ${{ needs.docker_lint.result }}
          RUNTIME: ${{ needs.docker_runtime.result }}
        run: test "$LINT" = success && test "$RUNTIME" = success

  publish_container:
    name: Publish release image to GHCR
    needs: [release, docker]
    if: needs.release.outputs.publish_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version tags and OCI labels
        id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ needs.release.outputs.image_name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.image_version }}
            type=raw,value=v${{ needs.release.outputs.image_version }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.image_version, '-') }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.image_version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish multi-platform image with SBOM and provenance
        id: publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.release.outputs.image_name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Published image %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  open_setup_pr:
    name: Open maintainer setup PR
    needs: [test, packages]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/chore/add-codeowners'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create bot-authored setup PR for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh pr view chore/add-codeowners --json url --jq .url; then
            gh pr create --base main --head chore/add-codeowners --title 'chore: add code ownership and repository guidance' --body-file .github/setup-pr.md
            gh pr edit chore/add-codeowners --add-reviewer d3rky
          fi
